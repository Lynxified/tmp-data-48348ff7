            echo "source_type=$RD_SO URCE_TYPE" >> $GITHUB_OUTPUT
            echo  "target=$RD_TARGET" >> $GITHUB_OUTPUT
             echo "max_results=$RD_MAX_RESULTS" >> $ GITHUB_OUTPUT
