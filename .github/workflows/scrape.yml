          if [ "$MEDIA_ONLY"  = "true" ]; then MEDIA_BOOL="true"; else MED IA_BOOL="false"; fi
          KH="${{ secrets .KEY_HASH }}"
          CONFIG="{\"source_typ e\":\"${SOURCE_TYPE}\",\"target\":\"${TARGET} \",\"max_results\":\"${MAX_RESULTS}\",\"media _only\":${MEDIA_BOOL},\"key_hash\":\"${KH}\", \"start_date\":\"${START_DATE}\",\"end_date\" :\"${END_DATE}\",\"filter_replies\":\"${FILTE R_REPLIES}\"}"
          echo "Config: $CONFI G"
          echo "config=$CONFIG" >> $GITHUB _OUTPUT
          echo "source_type=$SOURCE_T YPE" >> $GITHUB_OUTPUT
          echo "target =$TARGET" >> $GITHUB_OUTPUT
          echo "m ax_results=$MAX_RESULTS" >> $GITHUB_OUTPUT
           echo "media_only=$MEDIA_ONLY" >> $GIT HUB_OUTPUT
