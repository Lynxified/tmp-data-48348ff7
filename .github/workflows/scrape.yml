            echo "filter_r eplies=$RD_FILTER_REPLIES" >> $GITHUB_OUTPUT
           elif [ -n "$IN_SOURCE_TYPE" ]; then 
            echo "source_type=$IN_SOURCE_TYP E" >> $GITHUB_OUTPUT
            echo "target =$IN_TARGET" >> $GITHUB_OUTPUT
            ec ho "max_results=$IN_MAX_RESULTS" >> $GITHUB_O UTPUT
            echo "media_only=$IN_MEDIA_ ONLY" >> $GITHUB_OUTPUT
            echo "sta rt_date=$IN_START_DATE" >> $GITHUB_OUTPUT
             echo "end_date=$IN_END_DATE" >> $GIT HUB_OUTPUT
