name: Guildera Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (user/hashtag/keyword/url)'
        required: false
        default: ''
        type: string
      target:
        description: 'Search target'
        required: false
        default: ''
        type: string
      max_results:
        description: 'Max results'
        required: false
        default: ''
        type: string
      media_only:
        description: 'Media only (true/false)'
        required: false
        default: ''
        type: string
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      filter_replies:
        description: 'Filter replies (all/posts/replies)'
        required: false
        default: 'all'
        type: string
  repository_dispatch:
    types: [trigger-scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lynxified/guildera-scraper-template:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 8

    steps:
      - name: Run scraper
        working-directory: /app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          X_STATE: ${{ secrets.X_STATE }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type || github.event.client_payload.source_type || '' }}
          TARGET: ${{ github.event.inputs.target || github.event.client_payload.target || '' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || github.event.client_payload.max_results || '' }}
          MEDIA_ONLY: ${{ github.event.inputs.media_only || github.event.client_payload.media_only || '' }}
          START_DATE: ${{ github.event.inputs.start_date || github.event.client_payload.start_date || '' }}
          END_DATE: ${{ github.event.inputs.end_date || github.event.client_payload.end_date || '' }}
          FILTER_REPLIES: ${{ github.event.inputs.filter_replies || github.event.client_payload.filter_replies || 'all' }}
          KEY_HASH: ${{ secrets.KEY_HASH }}
        run: |
          echo "[DEBUG] SOURCE_TYPE=$SOURCE_TYPE TARGET=$TARGET MAX_RESULTS=$MAX_RESULTS FILTER_REPLIES=$FILTER_REPLIES MEDIA_ONLY=$MEDIA_ONLY"
          node scraper.js
